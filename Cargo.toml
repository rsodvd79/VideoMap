[package]
name = "videomap"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
description = "Editor e proiezione video mapping"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
directories = "6"
earcutr = "0.5"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "webp"] }
libloading = "0.8"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
pollster = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[profile.release]
lto = "thin"
strip = true
