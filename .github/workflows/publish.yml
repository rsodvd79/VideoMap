name: VideoMap build & publish

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v1.2.3)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ${{ matrix.os }}
    env:
      APP_VERSION: >-
        ${{
          startsWith(github.ref, 'refs/tags/') && github.ref_name ||
          github.event_name == 'workflow_dispatch' && github.event.inputs.tag ||
          format('v1.0.{0}', github.run_number)
        }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifactName: VideoMap-win-x64
          - os: macos-latest
            rid: osx-arm64
            artifactName: VideoMap-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Enforce tag format on push
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Push tag must start with 'v' and be numeric segments (e.g. v1.2.3)" >&2
            exit 1
          fi

      - name: Validate tag input
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          if [[ -z "${{ github.event.inputs.tag }}" ]]; then
            echo "Input 'tag' is required for manual runs" >&2
            exit 1
          fi
          if [[ ! "${{ github.event.inputs.tag }}" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Input 'tag' must start with 'v' and be numeric segments (e.g. v1.2.3)" >&2
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore "VideoMap.App/VideoMap.App.csproj"

      - name: Publish
        shell: bash
        run: |
          dotnet publish "VideoMap.App/VideoMap.App.csproj" \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:UseAppHost=true \
            -p:PublishSingleFile=false \
            -p:DebugType=None -p:DebugSymbols=false \
            -o "artifacts/${{ matrix.rid }}/publish"

      # Crea .app solo su macOS
      - name: Create macOS .app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          PUBLISH_DIR="artifacts/${{ matrix.rid }}/publish"
          APP_NAME="VideoMap"
          APP_BUNDLE="artifacts/${{ matrix.rid }}/${APP_NAME}.app"

          # Trova l'apphost (eseguibile) nella cartella publish
          APP_EXE="$(find "$PUBLISH_DIR" -maxdepth 1 -type f -perm -111 \
            ! -name "*.dll" ! -name "*.pdb" ! -name "*.json" ! -name "*.config" \
            | head -n 1 | xargs -I{} basename "{}")"

          if [ -z "$APP_EXE" ]; then
            echo "Impossibile trovare l'eseguibile (apphost) in $PUBLISH_DIR"
            ls -la "$PUBLISH_DIR"
            exit 1
          fi

          mkdir -p "$APP_BUNDLE/Contents/MacOS" "$APP_BUNDLE/Contents/Resources"
          cp -R "$PUBLISH_DIR/"* "$APP_BUNDLE/Contents/MacOS/"
          chmod +x "$APP_BUNDLE/Contents/MacOS/$APP_EXE"

          # Info.plist minimo
          cat > "$APP_BUNDLE/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>${APP_NAME}</string>
            <key>CFBundleDisplayName</key><string>${APP_NAME}</string>
            <key>CFBundleIdentifier</key><string>com.biemme.${APP_NAME}</string>
            <key>CFBundleVersion</key><string>${APP_VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${APP_VERSION}</string>
            <key>CFBundleExecutable</key><string>${APP_EXE}</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF

          # ZIP "corretto" per macOS (preserva risorse/attributi)
          ditto -c -k --sequesterRsrc --keepParent "$APP_BUNDLE" "artifacts/${{ matrix.rid }}/${APP_NAME}.zip"

      # Crea ZIP su Windows
      - name: Create Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "artifacts/${{ matrix.rid }}/publish/*" `
            -DestinationPath "artifacts/${{ matrix.rid }}/VideoMap.zip"

      - name: Upload artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: artifacts/${{ matrix.rid }}/VideoMap.zip

      - name: Upload artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: artifacts/${{ matrix.rid }}/VideoMap.zip

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    env:
      RELEASE_TAG: >-
        ${{
          startsWith(github.ref, 'refs/tags/') && github.ref_name ||
          github.event_name == 'workflow_dispatch' && github.event.inputs.tag ||
          format('v1.0.{0}', github.run_number)
        }}

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: VideoMap-win-x64
          path: release-assets/win-x64

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: VideoMap-macos-arm64
          path: release-assets/macos-arm64

      - name: Rename artifacts
        run: |
          mv release-assets/win-x64/VideoMap.zip \
             release-assets/VideoMap-win-x64-${RELEASE_TAG}.zip
          mv release-assets/macos-arm64/VideoMap.zip \
             release-assets/VideoMap-macos-arm64-${RELEASE_TAG}.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: VideoMap ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/VideoMap-win-x64-${{ env.RELEASE_TAG }}.zip
            release-assets/VideoMap-macos-arm64-${{ env.RELEASE_TAG }}.zip
          