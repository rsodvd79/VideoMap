name: VideoMap build & publish

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v1.2.3)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ${{ matrix.os }}
    env:
      VIDEOMAP_VERSION: >-
        ${{
          startsWith(github.ref, 'refs/tags/') && github.ref_name ||
          github.event_name == 'workflow_dispatch' && inputs.tag ||
          format('v1.0.{0}', github.run_number)
        }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact: VideoMap-win-x64
          - os: macos-latest
            platform: macos
            artifact: VideoMap-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VIDEOMAP_VERSION" =~ ^v[0-9]+(\.[0-9]+)*$ ]] || {
            echo "Versione non valida: usare v1.2.3" >&2
            exit 1
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Name archive
        shell: bash
        run: echo "ARCHIVE_NAME=VideoMap.${{ matrix.platform }}.$(date -u +%Y.%m.%d.%H.%M).zip" >> "$GITHUB_ENV"
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          ./build-macos.sh --no-open
          ditto -c -k --sequesterRsrc --keepParent dist/VideoMap.app "dist/$ARCHIVE_NAME"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/videomap.exe dist/VideoMap.exe
          Copy-Item packaging/LEGGIMI.txt dist/LEGGIMI.txt
          Compress-Archive -Path dist/VideoMap.exe,dist/LEGGIMI.txt -DestinationPath "dist/$env:ARCHIVE_NAME" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ env.ARCHIVE_NAME }}
          if-no-files-found: error

  release:
    needs: publish
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    env:
      RELEASE_TAG: >-
        ${{
          startsWith(github.ref, 'refs/tags/') && github.ref_name ||
          github.event_name == 'workflow_dispatch' && inputs.tag ||
          format('v1.0.{0}', github.run_number)
        }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VideoMap-win-x64
          path: release-assets/win-x64
      - uses: actions/download-artifact@v4
        with:
          name: VideoMap-macos-arm64
          path: release-assets/macos-arm64
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: VideoMap ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-assets/*/*.zip
